<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M64 28 C78 28 92 34 94 36 C94 56 88 82 64 98 C40 82 34 56 34 36 C36 34 50 28 64 28 Z" fill="url(#shieldGrad)" />

  <!-- Inner Checkmark -->
  <path d="M52 62 L60 70 L76 52" fill="none" stroke="#4f46e5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Security Pulse Dot -->
  <circle cx="98" cy="98" r="14" fill="#020617" />
  <circle cx="98" cy="98" r="10" fill="#10b981" />
  <circle cx="98" cy="98" r="4" fill="#ffffff" />
</svg>
